name: Build MineOS Gaming ISO

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (ex: 1.0.0)'
        required: false
        default: '1.0.0'
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        id: ver
        run: |
          V="${{ github.event.inputs.version || github.ref_name || '1.0.0' }}"
          V="${V#v}"
          echo "V=$V" >> $GITHUB_OUTPUT
          echo "Building MineOS Gaming v$V"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            live-build debootstrap squashfs-tools xorriso \
            grub-pc-bin grub-efi-amd64-bin mtools isolinux \
            syslinux-common rsync wget curl ca-certificates \
            imagemagick python3-pil
          echo "live-build: $(lb --version)"

      - name: Build ISO (single sudo script)
        run: |
          sudo bash -c '
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.V }}"

          echo "============================================"
          echo "  MineOS Gaming v${VERSION} — lb build"
          echo "============================================"

          # ── Workspace ────────────────────────────────
          mkdir -p /opt/mineos-build /opt/mineos-output
          cd /opt/mineos-build

          # ── lb config ────────────────────────────────
          echo "[1/8] lb config..."
          lb config \
            --architectures amd64 \
            --distribution bookworm \
            --debian-installer none \
            --binary-images iso-hybrid \
            --memtest none \
            --apt-recommends false \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap "http://deb.debian.org/debian" \
            --mirror-binary "http://deb.debian.org/debian" \
            --mirror-binary-security "http://security.debian.org/debian-security" \
            --iso-application "MineOS Gaming" \
            --iso-publisher "MineOS Project" \
            --iso-volume "MineOS-${VERSION}" \
            --bootappend-live "boot=live components quiet splash hostname=mineos username=user"

          # ── Hostname ─────────────────────────────────
          echo "[2/8] Hostname..."
          mkdir -p config/includes.chroot/etc
          echo "mineos" > config/includes.chroot/etc/hostname
          cat > config/includes.chroot/etc/hosts << '\''EOF'\''
          127.0.0.1   localhost
          127.0.1.1   mineos
          ::1         localhost ip6-localhost ip6-loopback
          EOF

          # ── Paquets ───────────────────────────────────
          echo "[3/8] Paquets..."
          mkdir -p config/package-lists

          cat > config/package-lists/00-base.list.chroot << '\''EOF'\''
          systemd
          systemd-sysv
          udev
          dbus
          policykit-1
          sudo
          wget
          curl
          ca-certificates
          gnupg
          apt-transport-https
          software-properties-common
          locales
          tzdata
          rsync
          EOF

          cat > config/package-lists/01-desktop.list.chroot << '\''EOF'\''
          openbox
          obconf
          lxappearance
          lxsession
          lightdm
          lightdm-gtk-greeter
          tint2
          nitrogen
          picom
          rofi
          dunst
          xorg
          xserver-xorg
          xinit
          x11-xserver-utils
          x11-utils
          xdg-utils
          xdg-user-dirs
          network-manager
          network-manager-gnome
          pulseaudio
          pavucontrol
          alsa-utils
          fonts-noto
          fonts-noto-color-emoji
          fonts-liberation
          papirus-icon-theme
          EOF

          cat > config/package-lists/02-apps.list.chroot << '\''EOF'\''
          thunar
          thunar-archive-plugin
          thunar-volman
          gvfs
          gvfs-backends
          udisks2
          mousepad
          tilix
          geany
          vlc
          gimp
          file-roller
          zip
          unzip
          p7zip-full
          htop
          neofetch
          bash-completion
          nano
          vim
          zenity
          scrot
          EOF

          cat > config/package-lists/03-wine.list.chroot << '\''EOF'\''
          wine
          wine64
          winetricks
          playonlinux
          EOF

          cat > config/package-lists/04-gaming.list.chroot << '\''EOF'\''
          gamemode
          mangohud
          mesa-vulkan-drivers
          mesa-va-drivers
          mesa-vdpau-drivers
          libvulkan1
          vulkan-tools
          libgl1-mesa-dri
          lutris
          EOF

          # ── Hooks ─────────────────────────────────────
          echo "[4/8] Hooks..."
          mkdir -p config/hooks/live

          # ─ Locale FR
          cat > config/hooks/live/0050-locale.hook.chroot << '\''HOOKEOF'\''
          #!/bin/bash
          set -e
          sed -i "s/# fr_FR.UTF-8/fr_FR.UTF-8/" /etc/locale.gen
          locale-gen
          update-locale LANG=fr_FR.UTF-8 LC_ALL=fr_FR.UTF-8
          HOOKEOF

          # ─ Google Chrome
          cat > config/hooks/live/0100-chrome.hook.chroot << '\''HOOKEOF'\''
          #!/bin/bash
          set -e
          echo ">>> Chrome..."
          wget -qO /tmp/chrome.deb \
            "https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb"
          apt-get install -y /tmp/chrome.deb || apt-get install -f -y
          rm -f /tmp/chrome.deb
          HOOKEOF

          # ─ Wine 32bit + DXVK
          cat > config/hooks/live/0200-wine.hook.chroot << '\''HOOKEOF'\''
          #!/bin/bash
          set -e
          echo ">>> Wine + DXVK..."
          dpkg --add-architecture i386
          apt-get update -qq
          apt-get install -y wine32 libwine:i386 fonts-wine \
            libvulkan1:i386 libgl1-mesa-dri:i386 2>/dev/null || true
          DXVK_VER="2.3.1"
          wget -qO /tmp/dxvk.tar.gz \
            "https://github.com/doitsujin/dxvk/releases/download/v${DXVK_VER}/dxvk-${DXVK_VER}.tar.gz" \
            || { echo "DXVK skip"; exit 0; }
          mkdir -p /tmp/dxvk
          tar -xzf /tmp/dxvk.tar.gz -C /tmp/dxvk --strip-components=1
          mkdir -p /usr/share/dxvk
          cp -r /tmp/dxvk/x32 /tmp/dxvk/x64 /usr/share/dxvk/
          rm -rf /tmp/dxvk*
          cat > /usr/local/bin/wine-dxvk-setup << '\''DXEOF'\''
          #!/bin/bash
          PREFIX="${WINEPREFIX:-$HOME/.wine}"
          cp /usr/share/dxvk/x64/*.dll "$PREFIX/drive_c/windows/system32/" 2>/dev/null || true
          cp /usr/share/dxvk/x32/*.dll "$PREFIX/drive_c/windows/syswow64/" 2>/dev/null || true
          echo "DXVK activé dans $PREFIX"
          DXEOF
          chmod +x /usr/local/bin/wine-dxvk-setup
          cat > /usr/share/applications/wine-exe.desktop << '\''DEOF'\''
          [Desktop Entry]
          Name=Wine EXE Launcher
          Exec=wine %f
          MimeType=application/x-ms-dos-executable;application/x-msi;
          Icon=wine
          Type=Application
          NoDisplay=true
          DEOF
          update-desktop-database 2>/dev/null || true
          HOOKEOF

          # ─ Kernel Liquorix
          cat > config/hooks/live/0250-kernel.hook.chroot << '\''HOOKEOF'\''
          #!/bin/bash
          set -e
          echo ">>> Kernel Liquorix..."
          wget -qO /tmp/liq.gpg "https://liquorix.net/liquorix-keyring.gpg" || exit 0
          install -D -m 644 /tmp/liq.gpg /usr/share/keyrings/liquorix-keyring.gpg
          . /etc/os-release
          echo "deb [signed-by=/usr/share/keyrings/liquorix-keyring.gpg] https://liquorix.net/debian ${VERSION_CODENAME} main" \
            > /etc/apt/sources.list.d/liquorix.list
          apt-get update -qq
          apt-get install -y linux-image-liquorix-amd64 linux-headers-liquorix-amd64 \
            || echo "Liquorix indispo, kernel Debian conservé"
          HOOKEOF

          # ─ Steam
          cat > config/hooks/live/0300-steam.hook.chroot << '\''HOOKEOF'\''
          #!/bin/bash
          set -e
          echo ">>> Steam..."
          dpkg --add-architecture i386
          apt-get update -qq
          apt-get install -y steam-installer 2>/dev/null || {
            wget -qO /tmp/steam.deb \
              "https://cdn.cloudflare.steamstatic.com/client/installer/steam.deb"
            apt-get install -y /tmp/steam.deb || true
            apt-get install -f -y || true
            rm -f /tmp/steam.deb
          }
          HOOKEOF

          # ─ GameMode + MangoHud
          cat > config/hooks/live/0400-gamemode.hook.chroot << '\''HOOKEOF'\''
          #!/bin/bash
          set -e
          echo ">>> GameMode + MangoHud..."
          apt-get install -y gamemode mangohud 2>/dev/null || true
          cat > /etc/gamemode.ini << '\''GMEOF'\''
          [general]
          renice=10
          ioprio=0
          inhibit_screensaver=1
          [cpu]
          park_cores=no
          pin_cores=yes
          governor=performance
          [gpu]
          apply_gpu_optimisations=accept-responsibility
          gpu_device=0
          [filter]
          whitelist=steam;lutris;wine;playonlinux
          GMEOF
          mkdir -p /etc/MangoHud
          cat > /etc/MangoHud/MangoHud.conf << '\''MHEOF'\''
          fps
          frame_timing
          cpu_load
          gpu_load
          ram
          cpu_temp
          gpu_temp
          position=top-left
          font_size=18
          background_alpha=0.5
          toggle_hud=Shift_R+F12
          MHEOF
          HOOKEOF

          # ─ GPU universel (NVIDIA / AMD / Intel)
          cat > config/hooks/live/0500-gpu.hook.chroot << '\''HOOKEOF'\''
          #!/bin/bash
          set -e
          echo ">>> GPU universel..."
          GPU_INFO=$(lspci 2>/dev/null | grep -iE "VGA|3D|Display" || true)
          HAS_NVIDIA=$(echo "$GPU_INFO" | grep -ic "nvidia" || true)
          HAS_AMD=$(echo "$GPU_INFO"   | grep -icE "amd|radeon|ati" || true)
          echo "GPU: $GPU_INFO"

          if [ "$HAS_NVIDIA" -gt 0 ]; then
            echo ">>> NVIDIA..."
            apt-get update -qq
            apt-get install -y nvidia-driver nvidia-settings libvulkan1 vulkan-tools 2>/dev/null || true
            cat > /etc/modprobe.d/blacklist-nouveau.conf << '\''EOF'\''
          blacklist nouveau
          options nouveau modeset=0
          EOF
            mkdir -p /etc/X11/xorg.conf.d
            cat > /etc/X11/xorg.conf.d/20-nvidia.conf << '\''EOF'\''
          Section "Device"
            Identifier "NVIDIA Card"
            Driver "nvidia"
            Option "NoLogo" "1"
            Option "TripleBuffer" "1"
            Option "AllowIndirectGLXProtocol" "0"
          EndSection
          EOF
            cat >> /etc/environment << '\''EOF'\''
          __GL_THREADED_OPTIMIZATIONS=1
          __GL_MaxFramesAllowed=1
          EOF
            update-initramfs -u 2>/dev/null || true

          elif [ "$HAS_AMD" -gt 0 ]; then
            echo ">>> AMD..."
            apt-get update -qq
            apt-get install -y firmware-amd-graphics libgl1-mesa-dri \
              mesa-vulkan-drivers mesa-va-drivers mesa-vdpau-drivers \
              libvulkan1 vulkan-tools radeontop libdrm-amdgpu1 2>/dev/null || true
            cat > /etc/modprobe.d/amdgpu.conf << '\''EOF'\''
          options amdgpu si_support=1
          options amdgpu cik_support=1
          options amdgpu dpm=1
          options amdgpu dc=1
          options amdgpu ppfeaturemask=0xffffffff
          blacklist radeon
          EOF
            cat >> /etc/environment << '\''EOF'\''
          RADV_PERFTEST=aco,ngg
          AMD_VULKAN_ICD=RADV
          mesa_glthread=true
          EOF
            sed -i "s/\[gpu\]/[gpu]\namd_performance_level=high/" /etc/gamemode.ini 2>/dev/null || true

          else
            echo ">>> Intel (défaut)..."
            apt-get update -qq
            apt-get install -y firmware-misc-nonfree intel-media-va-driver \
              libva-drm2 libva-x11-2 libgl1-mesa-dri \
              mesa-vulkan-drivers libvulkan1 vulkan-tools 2>/dev/null || true
            cat > /etc/modprobe.d/i915-gaming.conf << '\''EOF'\''
          options i915 enable_guc=3
          options i915 enable_fbc=1
          options i915 enable_psr=1
          options i915 fastboot=1
          options i915 nuclear_pageflip=1
          EOF
            cat >> /etc/environment << '\''EOF'\''
          MESA_LOADER_DRIVER_OVERRIDE=iris
          mesa_glthread=true
          vblank_mode=0
          EOF
          fi

          # Vulkan ICD auto-selector
          cat > /usr/local/bin/mineos-vulkan-setup << '\''VKEOF'\''
          #!/bin/bash
          GPU=$(lspci | grep -iE "VGA|3D" | head -1)
          if echo "$GPU" | grep -qi nvidia; then
            export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/nvidia_icd.json
          elif echo "$GPU" | grep -qiE "amd|radeon"; then
            export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/radeon_icd.x86_64.json
          else
            export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/intel_icd.x86_64.json
          fi
          VKEOF
          chmod +x /usr/local/bin/mineos-vulkan-setup

          # Script info GPU
          cat > /usr/local/bin/mineos-gpu-info << '\''GIEOF'\''
          #!/bin/bash
          echo "=== MineOS GPU Info ==="
          lspci | grep -iE "VGA|3D|Display"
          glxinfo 2>/dev/null | grep -E "renderer|version" | head -4 || true
          vulkaninfo 2>/dev/null | grep deviceName | head -2 || true
          GIEOF
          chmod +x /usr/local/bin/mineos-gpu-info
          HOOKEOF

          # ─ Tweaks système
          cat > config/hooks/live/0550-tweaks.hook.chroot << '\''HOOKEOF'\''
          #!/bin/bash
          set -e
          cat > /etc/sysctl.d/99-mineos-gaming.conf << '\''EOF'\''
          vm.swappiness=10
          vm.dirty_ratio=15
          vm.dirty_background_ratio=5
          kernel.sched_autogroup_enabled=1
          fs.file-max=2097152
          EOF
          cat >> /etc/security/limits.conf << '\''EOF'\''
          * soft nofile 1048576
          * hard nofile 1048576
          * soft memlock unlimited
          * hard memlock unlimited
          EOF
          mkdir -p /etc/pulse
          cat > /etc/pulse/daemon.conf << '\''EOF'\''
          default-sample-rate = 48000
          default-fragment-size-msec = 5
          default-fragments = 2
          realtime-scheduling = yes
          realtime-priority = 9
          high-priority = yes
          nice-level = -15
          EOF
          HOOKEOF

          # ─ Bureau Openbox
          cat > config/hooks/live/0600-desktop.hook.chroot << '\''HOOKEOF'\''
          #!/bin/bash
          set -e
          echo ">>> Bureau MineOS..."
          mkdir -p /etc/skel/.config/{openbox,tint2,picom,nitrogen}
          mkdir -p /etc/skel/{Bureau,Documents,Images,Musique,Telecharges,Jeux}
          mkdir -p /usr/share/themes/MineOS-Dark/{gtk-3.0,gtk-2.0}

          cat > /usr/share/themes/MineOS-Dark/gtk-3.0/gtk.css << '\''EOF'\''
          @define-color bg_color #1a1a2e;
          @define-color fg_color #e2e8f0;
          @define-color base_color #16213e;
          @define-color selected_bg_color #4ade80;
          @define-color selected_fg_color #0d1117;
          window,.background{background-color:@bg_color;color:@fg_color}
          headerbar,.titlebar{background:#0d2137;border-bottom:1px solid #2d4a6e}
          button{background:rgba(74,222,128,.1);border:1px solid #2d4a6e;border-radius:4px;color:@fg_color}
          button:hover{background:rgba(74,222,128,.2);border-color:#4ade80}
          entry{background:rgba(0,0,0,.4);border:1px solid #2d4a6e;border-radius:4px;color:#22d3ee}
          treeview,.view{background:@base_color;color:@fg_color}
          treeview:selected{background:rgba(74,222,128,.15);color:#4ade80}
          EOF

          cat > /etc/skel/.config/openbox/autostart << '\''EOF'\''
          nitrogen --restore &
          picom --config ~/.config/picom/picom.conf &
          tint2 &
          nm-applet &
          dunst &
          pulseaudio --start &
          xdg-user-dirs-update &
          /usr/lib/gamemode/gamemoded 2>/dev/null &
          source /usr/local/bin/mineos-vulkan-setup 2>/dev/null &
          EOF

          cat > /etc/skel/.config/openbox/menu.xml << '\''EOF'\''
          <?xml version="1.0" encoding="UTF-8"?>
          <openbox_menu>
            <menu id="root-menu" label="MineOS">
              <item label="Chrome"><action name="Execute"><command>google-chrome-stable</command></action></item>
              <menu id="gaming-menu" label="Gaming">
                <item label="Steam"><action name="Execute"><command>gamemoderun steam</command></action></item>
                <item label="Lutris"><action name="Execute"><command>lutris</command></action></item>
                <item label="PlayOnLinux"><action name="Execute"><command>playonlinux</command></action></item>
                <item label="Lancer .exe"><action name="Execute"><command>mineos-exe</command></action></item>
                <item label="Winetricks"><action name="Execute"><command>winetricks --gui</command></action></item>
              </menu>
              <item label="Fichiers"><action name="Execute"><command>thunar</command></action></item>
              <item label="Terminal"><action name="Execute"><command>tilix</command></action></item>
              <item label="Bloc-notes"><action name="Execute"><command>mousepad</command></action></item>
              <item label="VLC"><action name="Execute"><command>vlc</command></action></item>
              <item label="Apparence"><action name="Execute"><command>lxappearance</command></action></item>
              <item label="Eteindre"><action name="Execute"><command>systemctl poweroff</command></action></item>
              <item label="Redemarrer"><action name="Execute"><command>systemctl reboot</command></action></item>
            </menu>
          </openbox_menu>
          EOF

          cat > /etc/skel/.config/openbox/rc.xml << '\''EOF'\''
          <?xml version="1.0" encoding="UTF-8"?>
          <openbox_config>
            <theme><name>MineOS-Dark</name>
              <font place="ActiveWindow"><name>Noto Sans</name><size>10</size><weight>Bold</weight></font>
            </theme>
            <desktops><number>4</number><firstdesk>1</firstdesk></desktops>
            <keyboard>
              <keybind key="Super-Return"><action name="Execute"><command>tilix</command></action></keybind>
              <keybind key="Super-e"><action name="Execute"><command>thunar</command></action></keybind>
              <keybind key="Super-b"><action name="Execute"><command>google-chrome-stable</command></action></keybind>
              <keybind key="Super-g"><action name="Execute"><command>gamemoderun steam</command></action></keybind>
              <keybind key="Super-l"><action name="Execute"><command>lutris</command></action></keybind>
              <keybind key="Super-r"><action name="Execute"><command>rofi -show run</command></action></keybind>
              <keybind key="A-F4"><action name="Close"/></keybind>
              <keybind key="Super-d"><action name="ToggleShowDesktop"/></keybind>
              <keybind key="A-Tab"><action name="NextWindow"/></keybind>
            </keyboard>
            <mouse>
              <context name="Desktop">
                <mousebind button="Right" action="Press">
                  <action name="ShowMenu"><menu>root-menu</menu></action>
                </mousebind>
              </context>
              <context name="Titlebar">
                <mousebind button="Left" action="Drag"><action name="Move"/></mousebind>
                <mousebind button="Left" action="DoubleClick"><action name="MaximizeWindow"/></mousebind>
              </context>
            </mouse>
          </openbox_config>
          EOF

          cat > /etc/skel/.bashrc << '\''EOF'\''
          export LANG=fr_FR.UTF-8
          export WINEFSYNC=1
          export mesa_glthread=true
          PS1="\[\e[0;32m\]mining \[\e[1;36m\]\u\[\e[0;37m\]@\[\e[1;34m\]mineos\[\e[0;37m\]:\[\e[1;33m\]\w\[\e[0m\]\$ "
          alias ls="ls --color=auto"
          alias ll="ls -lah --color=auto"
          alias chrome="google-chrome-stable"
          alias exe="gamemoderun wine"
          alias exe-dxvk="DXVK_HUD=fps gamemoderun wine"
          alias steam="gamemoderun steam"
          alias gpu="mineos-gpu-info"
          [ -f /etc/bash_completion ] && . /etc/bash_completion
          source /usr/local/bin/mineos-vulkan-setup 2>/dev/null
          echo "  MineOS Gaming — exe <fichier.exe> | Super+G=Steam | gpu=infos GPU"
          EOF

          for APP in steam lutris chrome terminal; do
            case $APP in
              steam)    EXEC="gamemoderun steam"; ICON="steam";          NAME="Steam"        ;;
              lutris)   EXEC="lutris";             ICON="lutris";         NAME="Lutris"       ;;
              chrome)   EXEC="google-chrome-stable"; ICON="google-chrome"; NAME="Chrome"     ;;
              terminal) EXEC="tilix";               ICON="terminal";       NAME="Terminal"    ;;
            esac
            cat > "/etc/skel/Bureau/${APP}.desktop" << DEOF
          [Desktop Entry]
          Name=${NAME}
          Exec=${EXEC}
          Icon=${ICON}
          Type=Application
          DEOF
            chmod +x "/etc/skel/Bureau/${APP}.desktop"
          done

          mkdir -p /usr/share/mineos
          python3 -c "
          from PIL import Image,ImageDraw
          img=Image.new(\"RGB\",(1920,1080),\"#1a1a2e\")
          d=ImageDraw.Draw(img)
          [d.line([(x,0),(x,1080)],fill=\"#1f2a3d\") for x in range(0,1920,32)]
          [d.line([(0,y),(1920,y)],fill=\"#1f2a3d\") for y in range(0,1080,32)]
          img.save(\"/usr/share/mineos/wallpaper.png\")
          " 2>/dev/null || convert -size 1920x1080 gradient:"#1a1a2e-#0d2137" \
            /usr/share/mineos/wallpaper.png 2>/dev/null || true

          mkdir -p /etc/skel/.config/nitrogen
          cat > /etc/skel/.config/nitrogen/bg-saved.cfg << '\''EOF'\''
          [xin_-1]
          file=/usr/share/mineos/wallpaper.png
          mode=4
          bgcolor=#1a1a2e
          EOF

          cat > /usr/local/bin/mineos-exe << '\''EOF'\''
          #!/bin/bash
          FILE="$1"
          if [ -z "$FILE" ]; then
            FILE=$(zenity --file-selection \
              --file-filter="Executables | *.exe *.msi *.bat" \
              --title="MineOS - Choisir un .exe" 2>/dev/null)
            [ -z "$FILE" ] && exit 0
          fi
          notify-send "MineOS" "Lancement : $(basename "$FILE")" 2>/dev/null
          WINEFSYNC=1 gamemoderun wine "$FILE"
          EOF
          chmod +x /usr/local/bin/mineos-exe
          HOOKEOF

          # ─ LightDM
          cat > config/hooks/live/0700-lightdm.hook.chroot << '\''HOOKEOF'\''
          #!/bin/bash
          set -e
          mkdir -p /etc/lightdm
          cat > /etc/lightdm/lightdm.conf << '\''EOF'\''
          [Seat:*]
          autologin-user=user
          autologin-user-timeout=0
          greeter-session=lightdm-gtk-greeter
          user-session=openbox
          EOF
          cat > /etc/lightdm/lightdm-gtk-greeter.conf << '\''EOF'\''
          [greeter]
          background=#1a1a2e
          theme-name=MineOS-Dark
          icon-theme-name=Papirus-Dark
          font-name=Noto Sans 11
          clock-format=%H:%M - %A %d %B
          EOF
          HOOKEOF

          # chmod tous les hooks
          chmod +x config/hooks/live/*.hook.chroot

          # ── Compression ───────────────────────────────
          echo "[5/8] Compression..."
          mkdir -p config/compression
          echo "xz" > config/compression/filesystem

          # ── lb build ──────────────────────────────────
          echo "[6/8] lb build (20-30 min)..."
          lb build 2>&1 | tee /tmp/lb-build.log

          # ── Récupérer ISO ─────────────────────────────
          echo "[7/8] Collecte ISO..."
          ISO=$(find /opt/mineos-build -name "*.iso" 2>/dev/null | head -1)
          if [ -z "$ISO" ]; then
            echo "ISO introuvable. Log:"
            tail -80 /tmp/lb-build.log
            exit 1
          fi

          mkdir -p /opt/mineos-output
          cp "$ISO" "/opt/mineos-output/MineOS-Gaming-${VERSION}-x86_64.iso"
          sha256sum "/opt/mineos-output/MineOS-Gaming-${VERSION}-x86_64.iso" \
            > /opt/mineos-output/SHA256SUMS

          echo "[8/8] Done!"
          echo "ISO: $(du -sh /opt/mineos-output/MineOS-Gaming-${VERSION}-x86_64.iso | cut -f1)"
          '

      - name: Copy ISO to workspace
        run: |
          mkdir -p build
          sudo cp /opt/mineos-output/*.iso build/ 2>/dev/null || true
          sudo cp /opt/mineos-output/SHA256SUMS build/ 2>/dev/null || true
          sudo chown -R $USER:$USER build/
          ls -lh build/

      - name: Get stats
        id: stats
        run: |
          ISO=$(ls build/*.iso 2>/dev/null | head -1)
          if [ -n "$ISO" ]; then
            echo "SIZE=$(du -sh $ISO | cut -f1)" >> $GITHUB_OUTPUT
            echo "SHA256=$(sha256sum $ISO | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          else
            echo "❌ ISO manquant"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MineOS-Gaming-${{ steps.ver.outputs.V }}
          path: build/
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          name: "MineOS Gaming ${{ steps.ver.outputs.V }}"
          body: |
            ## MineOS Gaming ${{ steps.ver.outputs.V }}
            - Steam | Lutris | Wine + DXVK | GameMode | MangoHud
            - GPU universel : NVIDIA / AMD / Intel auto-détecté
            - Kernel Liquorix | swappiness=10 | audio low-latency
            - **Taille :** ${{ steps.stats.outputs.SIZE }}
            - **SHA256 :** `${{ steps.stats.outputs.SHA256 }}`
            ```bash
            sudo dd if=MineOS-Gaming-${{ steps.ver.outputs.V }}-x86_64.iso of=/dev/sdX bs=4M status=progress
            ```
          files: build/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## MineOS Gaming Build OK" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.ver.outputs.V }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Taille | ${{ steps.stats.outputs.SIZE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA256 | \`${{ steps.stats.outputs.SHA256 }}\` |" >> $GITHUB_STEP_SUMMARY
