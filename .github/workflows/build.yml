name: "⛏ MineOS Gaming ISO — Build v13"

# ─── DÉCLENCHEURS ────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (ex: 1.0.0)"
        required: false
        default: "1.0.0"
  push:
    tags:
      - "v*"

# Permissions write pour créer des Releases GitHub
permissions:
  contents: write

jobs:
  build:
    name: "Build MineOS Gaming ${{ github.event.inputs.version || github.ref_name || '1.0.0' }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      # ── 2. Version ──────────────────────────────────────────────────────
      - name: "🏷️ Définir la version"
        id: ver
        run: |
          V="${{ github.event.inputs.version || github.ref_name || '1.0.0' }}"
          V="${V#v}"
          echo "V=$V" >> $GITHUB_OUTPUT
          echo "::notice::Build MineOS Gaming v$V"

      # ── 3. Dépendances hôte ──────────────────────────────────────────────
      - name: "📦 Installer les outils de build"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            squashfs-tools \
            xorriso isolinux syslinux-common \
            grub-pc-bin grub-efi-amd64-bin grub-efi-amd64 \
            shim-signed mtools efibootmgr \
            debootstrap rsync wget curl ca-certificates \
            imagemagick python3-pil \
            dosfstools genisoimage
          
          echo "=== Versions des outils ==="
          xorriso --version 2>&1 | head -1
          mksquashfs -version 2>&1 | head -1
          grub-mkimage --version 2>&1 | head -1

      # ── 4. Cache ISO Ubuntu ──────────────────────────────────────────────
      - name: "💾 Cache ISO Ubuntu 22.04"
        id: cache-iso
        uses: actions/cache@v4
        with:
          path: /opt/mineos-cache
          key: ubuntu-22.04-server-iso-v1

      # ── 5. Build ─────────────────────────────────────────────────────────
      - name: "🔨 Build MineOS Gaming v${{ steps.ver.outputs.V }}"
        run: |
          chmod +x scripts/*.sh
          sudo bash scripts/build.sh "${{ steps.ver.outputs.V }}"

      # ── 6. Vérification ISO ──────────────────────────────────────────────
      - name: "✅ Vérification ISO"
        id: iso
        run: |
          ISO=$(ls /opt/mineos-output/*.iso 2>/dev/null | head -1)
          if [ -z "$ISO" ]; then
            echo "::error::ISO introuvable dans /opt/mineos-output/"
            ls -la /opt/mineos-output/ || true
            exit 1
          fi
          SIZE=$(du -sh "$ISO" | cut -f1)
          SHA=$(sha256sum "$ISO" | cut -d' ' -f1)
          echo "ISO=$ISO"           >> $GITHUB_OUTPUT
          echo "SIZE=$SIZE"         >> $GITHUB_OUTPUT
          echo "SHA256=$SHA"        >> $GITHUB_OUTPUT
          echo "BASENAME=$(basename $ISO)" >> $GITHUB_OUTPUT
          echo "::notice::✅ ISO générée : $(basename $ISO) — $SIZE"

      # ── 7. Copier vers workspace ─────────────────────────────────────────
      - name: "📁 Copier l'ISO dans le workspace"
        run: |
          mkdir -p build
          sudo cp /opt/mineos-output/*.iso    build/ 2>/dev/null || true
          sudo cp /opt/mineos-output/SHA256SUMS build/ 2>/dev/null || true
          sudo chown -R "$USER:$USER" build/
          ls -lh build/

      # ── 8. Upload artifact ───────────────────────────────────────────────
      - name: "⬆️ Upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: "MineOS-Gaming-${{ steps.ver.outputs.V }}"
          path: build/
          retention-days: 30

      # ── 9. GitHub Release (sur tag seulement) ───────────────────────────
      - name: "🚀 Créer une Release GitHub"
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          name: "⛏ MineOS Gaming ${{ steps.ver.outputs.V }}"
          body: |
            ## ⛏ MineOS Gaming ${{ steps.ver.outputs.V }}
            
            **Base :** Ubuntu 22.04 LTS (Jammy Jellyfish)  
            **Build :** approche chroot direct (sans live-build)
            
            ### 🎮 Ce qui est inclus
            - **Steam** + **Lutris** + **Heroic Games** (Epic/GOG)
            - **Wine** + **DXVK** (DirectX → Vulkan) + **Bottles**
            - **GameMode** + **MangoHud** (overlay FPS)
            - **Kernel Liquorix** (si dispo) — optimisé gaming
            - **GPU auto-détecté** au démarrage (NVIDIA / AMD / Intel)
            - **Opera GX** (ou Chromium en fallback)
            - **MineOS Store** — installer apps Linux + Windows en 2 clics
            - **Discord, Spotify, OBS** via Flatpak
            - **XFCE** + thème **MineOS Dark** + icônes Papirus
            
            ### 📊 Build info
            | Attribut | Valeur |
            |----------|--------|
            | Version  | ${{ steps.ver.outputs.V }} |
            | Taille   | ${{ steps.iso.outputs.SIZE }} |
            | SHA256   | `${{ steps.iso.outputs.SHA256 }}` |
            
            ### 💾 Flash USB
            ```bash
            # Linux
            sudo dd if=${{ steps.iso.outputs.BASENAME }} of=/dev/sdX bs=4M status=progress oflag=sync
            
            # Ou avec Balena Etcher (Windows/macOS/Linux)
            # https://www.balena.io/etcher/
            ```
            
            ### ✅ Booter
            1. Redémarrer → F2/F8/F12 → Sélectionner la clé USB
            2. "MineOS Gaming (Live)" → démarrage direct
            3. "mode sans échec" si problème de GPU
          files: build/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 10. Résumé ───────────────────────────────────────────────────────
      - name: "📊 Résumé du build"
        run: |
          cat >> $GITHUB_STEP_SUMMARY << SUMMARY
          ## ✅ MineOS Gaming v${{ steps.ver.outputs.V }} — Build réussi !
          
          | Attribut | Valeur |
          |----------|--------|
          | Version  | \`${{ steps.ver.outputs.V }}\` |
          | Base     | Ubuntu 22.04 LTS Jammy |
          | Méthode  | chroot direct (sans live-build) |
          | Taille   | ${{ steps.iso.outputs.SIZE }} |
          | SHA256   | \`${{ steps.iso.outputs.SHA256 }}\` |
          
          ### 🎮 Contenu
          - Steam · Lutris · Heroic · Wine + DXVK · GameMode · MangoHud
          - GPU : NVIDIA / AMD / Intel — détection automatique au démarrage
          - Kernel Liquorix · PulseAudio low-latency · sysctl gaming
          - MineOS Store · Opera GX · Discord · Spotify · OBS
          
          ### 💾 Flash USB
          \`\`\`bash
          sudo dd if=${{ steps.iso.outputs.BASENAME }} of=/dev/sdX bs=4M status=progress oflag=sync
          \`\`\`
          SUMMARY
