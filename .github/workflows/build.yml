name: Build MineOS Gaming ISO

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (ex: 1.0.0)'
        required: false
        default: '1.0.0'
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      # ── 1. Checkout ──────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Version ───────────────────────────────────────
      - name: Set version
        id: ver
        run: |
          V="${{ github.event.inputs.version || github.ref_name || '1.0.0' }}"
          V="${V#v}"
          echo "V=$V" >> $GITHUB_OUTPUT
          echo "Building MineOS Gaming v$V"

      # ── 3. Dépendances ───────────────────────────────────
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            isolinux \
            syslinux-common \
            rsync \
            wget \
            curl \
            ca-certificates \
            imagemagick \
            python3-pil \
            python3-pip

          echo "live-build: $(lb --version)"
          echo "debootstrap: $(debootstrap --version)"

      # ── 4. Permissions ───────────────────────────────────
      - name: Fix permissions
        run: |
          chmod +x scripts/build.sh
          # GitHub Actions runner est déjà root-capable via sudo
          # On s'assure que le workspace est accessible
          sudo chown -R $USER:$USER .

      # ── 5. Workspace de build ────────────────────────────
      - name: Prepare build workspace
        run: |
          mkdir -p build
          # live-build doit tourner depuis son propre dossier
          mkdir -p lb-workspace
          # Copier les scripts dans lb-workspace pour qu'ils soient accessibles
          cp -r scripts lb-workspace/
          echo "Workspace prêt"

      # ── 6. lb config (directement, sans passer par build.sh) ─
      - name: Configure live-build
        working-directory: lb-workspace
        run: |
          VERSION="${{ steps.ver.outputs.V }}"

          sudo lb config \
            --architectures amd64 \
            --distribution bookworm \
            --debian-installer none \
            --binary-images iso-hybrid \
            --memtest none \
            --apt-recommends false \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap "http://deb.debian.org/debian" \
            --mirror-binary "http://deb.debian.org/debian" \
            --mirror-binary-security "http://security.debian.org/debian-security" \
            --iso-application "MineOS Gaming" \
            --iso-publisher "MineOS Project" \
            --iso-volume "MineOS-${VERSION}" \
            --bootappend-live "boot=live components quiet splash hostname=mineos username=user"

          echo "lb config OK"

      # ── 7. Hostname & hosts ──────────────────────────────
      - name: Setup hostname files
        working-directory: lb-workspace
        run: |
          mkdir -p config/includes.chroot/etc
          echo "mineos" | sudo tee config/includes.chroot/etc/hostname
          sudo tee config/includes.chroot/etc/hosts << 'HOSTSEOF'
          127.0.0.1   localhost
          127.0.1.1   mineos
          ::1         localhost ip6-localhost ip6-loopback
          HOSTSEOF

      # ── 8. Listes de paquets ─────────────────────────────
      - name: Setup package lists
        working-directory: lb-workspace
        run: |
          sudo mkdir -p config/package-lists

          sudo tee config/package-lists/00-base.list.chroot << 'EOF'
          systemd
          systemd-sysv
          udev
          dbus
          policykit-1
          sudo
          wget
          curl
          ca-certificates
          gnupg
          apt-transport-https
          software-properties-common
          locales
          tzdata
          rsync
          EOF

          sudo tee config/package-lists/01-desktop.list.chroot << 'EOF'
          openbox
          obconf
          lxappearance
          lxsession
          lightdm
          lightdm-gtk-greeter
          tint2
          nitrogen
          picom
          rofi
          dunst
          xorg
          xserver-xorg
          xinit
          x11-xserver-utils
          x11-utils
          xdg-utils
          xdg-user-dirs
          network-manager
          network-manager-gnome
          pulseaudio
          pavucontrol
          alsa-utils
          fonts-noto
          fonts-noto-color-emoji
          fonts-liberation
          papirus-icon-theme
          EOF

          sudo tee config/package-lists/02-apps.list.chroot << 'EOF'
          thunar
          thunar-archive-plugin
          thunar-volman
          gvfs
          gvfs-backends
          udisks2
          mousepad
          tilix
          geany
          vlc
          gimp
          file-roller
          zip
          unzip
          p7zip-full
          htop
          neofetch
          bash-completion
          nano
          vim
          zenity
          scrot
          EOF

          sudo tee config/package-lists/03-wine.list.chroot << 'EOF'
          wine
          wine64
          winetricks
          playonlinux
          EOF

          sudo tee config/package-lists/04-gaming.list.chroot << 'EOF'
          gamemode
          mangohud
          mesa-vulkan-drivers
          mesa-va-drivers
          mesa-vdpau-drivers
          libvulkan1
          vulkan-tools
          libgl1-mesa-dri
          lutris
          EOF

      # ── 9. Hooks ─────────────────────────────────────────
      - name: Setup hooks
        working-directory: lb-workspace
        run: |
          sudo mkdir -p config/hooks/live

          # ── Locale FR
          sudo tee config/hooks/live/0050-locale.hook.chroot << 'HOOKEOF'
          #!/bin/bash
          set -e
          sed -i 's/# fr_FR.UTF-8/fr_FR.UTF-8/' /etc/locale.gen
          locale-gen
          update-locale LANG=fr_FR.UTF-8 LC_ALL=fr_FR.UTF-8
          HOOKEOF

          # ── Google Chrome
          sudo tee config/hooks/live/0100-chrome.hook.chroot << 'HOOKEOF'
          #!/bin/bash
          set -e
          echo ">>> Installing Chrome..."
          wget -qO /tmp/chrome.deb \
            "https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb"
          apt-get install -y /tmp/chrome.deb || true
          apt-get install -f -y
          rm -f /tmp/chrome.deb
          echo ">>> Chrome: $(google-chrome --version 2>/dev/null || echo OK)"
          HOOKEOF

          # ── Wine 32bit + DXVK
          sudo tee config/hooks/live/0200-wine-gaming.hook.chroot << 'HOOKEOF'
          #!/bin/bash
          set -e
          echo ">>> Wine 32bit + DXVK..."
          dpkg --add-architecture i386
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            wine32 \
            libwine:i386 \
            fonts-wine \
            libvulkan1:i386 \
            libgl1-mesa-dri:i386 2>/dev/null || true

          # DXVK
          DXVK_VER="2.3.1"
          wget -qO /tmp/dxvk.tar.gz \
            "https://github.com/doitsujin/dxvk/releases/download/v${DXVK_VER}/dxvk-${DXVK_VER}.tar.gz" || exit 0
          mkdir -p /tmp/dxvk
          tar -xzf /tmp/dxvk.tar.gz -C /tmp/dxvk --strip-components=1
          mkdir -p /usr/share/dxvk
          cp -r /tmp/dxvk/x32 /tmp/dxvk/x64 /usr/share/dxvk/
          rm -rf /tmp/dxvk*

          cat > /usr/local/bin/wine-dxvk-setup << 'DXEOF'
          #!/bin/bash
          PREFIX="${WINEPREFIX:-$HOME/.wine}"
          for f in /usr/share/dxvk/x64/*.dll; do
            cp "$f" "$PREFIX/drive_c/windows/system32/" 2>/dev/null || true
          done
          for f in /usr/share/dxvk/x32/*.dll; do
            cp "$f" "$PREFIX/drive_c/windows/syswow64/" 2>/dev/null || true
          done
          echo "DXVK activé dans $PREFIX"
          DXEOF
          chmod +x /usr/local/bin/wine-dxvk-setup

          cat > /usr/share/applications/wine-exe.desktop << 'DEOF'
          [Desktop Entry]
          Name=Wine EXE Launcher
          Exec=wine %f
          MimeType=application/x-ms-dos-executable;application/x-msi;
          Icon=wine
          Type=Application
          NoDisplay=true
          DEOF
          update-desktop-database 2>/dev/null || true
          HOOKEOF

          # ── Kernel Liquorix
          sudo tee config/hooks/live/0250-kernel.hook.chroot << 'HOOKEOF'
          #!/bin/bash
          set -e
          echo ">>> Kernel Liquorix..."
          wget -qO /tmp/liq.gpg "https://liquorix.net/liquorix-keyring.gpg" || exit 0
          install -D -m 644 /tmp/liq.gpg /usr/share/keyrings/liquorix-keyring.gpg
          . /etc/os-release
          echo "deb [signed-by=/usr/share/keyrings/liquorix-keyring.gpg] \
            https://liquorix.net/debian ${VERSION_CODENAME} main" \
            > /etc/apt/sources.list.d/liquorix.list
          apt-get update -qq
          apt-get install -y linux-image-liquorix-amd64 linux-headers-liquorix-amd64 || \
            echo "Liquorix indispo, kernel Debian conservé"
          HOOKEOF

          # ── Steam
          sudo tee config/hooks/live/0300-steam.hook.chroot << 'HOOKEOF'
          #!/bin/bash
          set -e
          echo ">>> Steam..."
          dpkg --add-architecture i386
          apt-get update -qq
          apt-get install -y steam-installer 2>/dev/null || {
            wget -qO /tmp/steam.deb \
              "https://cdn.cloudflare.steamstatic.com/client/installer/steam.deb"
            apt-get install -y /tmp/steam.deb || true
            apt-get install -f -y || true
            rm -f /tmp/steam.deb
          }
          HOOKEOF

          # ── GameMode + MangoHud
          sudo tee config/hooks/live/0400-gamemode.hook.chroot << 'HOOKEOF'
          #!/bin/bash
          set -e
          echo ">>> GameMode + MangoHud..."
          apt-get install -y gamemode mangohud 2>/dev/null || true

          cat > /etc/gamemode.ini << 'GMEOF'
          [general]
          renice=10
          ioprio=0
          inhibit_screensaver=1
          [cpu]
          park_cores=no
          pin_cores=yes
          governor=performance
          [gpu]
          apply_gpu_optimisations=accept-responsibility
          gpu_device=0
          [filter]
          whitelist=steam;lutris;wine;playonlinux
          GMEOF

          mkdir -p /etc/MangoHud
          cat > /etc/MangoHud/MangoHud.conf << 'MHEOF'
          fps
          frame_timing
          cpu_load
          gpu_load
          ram
          cpu_temp
          gpu_temp
          position=top-left
          font_size=18
          background_alpha=0.5
          toggle_hud=Shift_R+F12
          MHEOF
          HOOKEOF

          # ── Tweaks système gaming
          sudo tee config/hooks/live/0500-tweaks.hook.chroot << 'HOOKEOF'
          #!/bin/bash
          # ── Tweaks système + GPU universel (NVIDIA / AMD / Intel)
          sudo tee config/hooks/live/0500-tweaks.hook.chroot << 'HOOKEOF'
          #!/bin/bash
          set -e
          echo ">>> Tweaks gaming + GPU universel..."

          # ════════════════════════════════════════
          #  DÉTECTION GPU
          # ════════════════════════════════════════
          detect_gpu() {
            lspci 2>/dev/null | grep -iE "VGA|3D|Display" || true
          }
          GPU_INFO=$(detect_gpu)
          HAS_NVIDIA=$(echo "$GPU_INFO" | grep -ic "nvidia" || true)
          HAS_AMD=$(echo "$GPU_INFO"   | grep -icE "amd|radeon|ati" || true)
          HAS_INTEL=$(echo "$GPU_INFO" | grep -ic "intel" || true)

          echo "GPU détecté :"
          echo "$GPU_INFO"
          echo "NVIDIA=$HAS_NVIDIA | AMD=$HAS_AMD | INTEL=$HAS_INTEL"

          # ════════════════════════════════════════
          #  NVIDIA — drivers propriétaires + CUDA
          # ════════════════════════════════════════
          if [ "$HAS_NVIDIA" -gt 0 ]; then
            echo ">>> NVIDIA détecté — installation drivers..."

            # Repo non-free déjà activé dans lb config
            apt-get update -qq
            apt-get install -y \
              nvidia-driver \
              nvidia-settings \
              nvidia-smi \
              libvulkan1 \
              vulkan-tools \
              libnvidia-gl-$(apt-cache show nvidia-driver 2>/dev/null \
                | grep Version | head -1 | grep -oP '\d+' | head -1 || echo "535") 2>/dev/null || \
            apt-get install -y nvidia-driver libvulkan1 vulkan-tools 2>/dev/null || \
              echo "NVIDIA driver install failed, nouveau fallback"

            # Désactiver Nouveau (conflicte avec propriétaire)
            cat > /etc/modprobe.d/blacklist-nouveau.conf << 'NEOF'
          blacklist nouveau
          options nouveau modeset=0
          NEOF
            update-initramfs -u 2>/dev/null || true

            # Config Xorg NVIDIA
            mkdir -p /etc/X11
            cat > /etc/X11/xorg.conf.d/20-nvidia.conf << 'XEOF'
          Section "Device"
            Identifier "NVIDIA Card"
            Driver "nvidia"
            Option "NoLogo" "1"
            Option "TripleBuffer" "1"
            Option "AllowIndirectGLXProtocol" "0"
            Option "RegistryDwords" "PerfLevelSrc=0x2222"
          EndSection
          XEOF

            # nvidia-settings persistance
            cat > /etc/skel/.nvidia-settings-rc << 'NVEOF'
          [0]/GPUPowerMizerMode=1
          [0]/GPUFanControlState=0
          NVEOF

            # Variables env NVIDIA gaming
            cat >> /etc/environment << 'ENVEOF'
          __GL_THREADED_OPTIMIZATIONS=1
          __GL_YIELD=NOTHING
          __GL_MaxFramesAllowed=1
          ENVEOF

            echo ">>> NVIDIA configuré"

          # ════════════════════════════════════════
          #  AMD — drivers Mesa + AMDGPU + ROCm lite
          # ════════════════════════════════════════
          elif [ "$HAS_AMD" -gt 0 ]; then
            echo ">>> AMD détecté — installation drivers AMDGPU..."

            apt-get update -qq
            apt-get install -y \
              firmware-amd-graphics \
              libgl1-mesa-dri \
              mesa-vulkan-drivers \
              mesa-va-drivers \
              mesa-vdpau-drivers \
              libvulkan1 \
              vulkan-tools \
              radeontop \
              libdrm-amdgpu1 2>/dev/null || true

            # Forcer AMDGPU (désactiver radeon ancien)
            cat > /etc/modprobe.d/amdgpu.conf << 'AMDEOF'
          # MineOS AMD Gaming
          options amdgpu si_support=1
          options amdgpu cik_support=1
          options amdgpu dpm=1
          options amdgpu dc=1
          options amdgpu ppfeaturemask=0xffffffff
          blacklist radeon
          AMDEOF

            # Variables env AMD gaming
            cat >> /etc/environment << 'ENVEOF'
          RADV_PERFTEST=aco,ngg
          AMD_VULKAN_ICD=RADV
          mesa_glthread=true
          LIBGL_DRI3_DISABLE=0
          vblank_mode=0
          ENVEOF

            # GameMode AMD spécifique
            cat > /etc/gamemode.ini << 'GMEOF'
          [general]
          renice=10
          ioprio=0
          inhibit_screensaver=1
          [cpu]
          park_cores=no
          pin_cores=yes
          governor=performance
          [gpu]
          apply_gpu_optimisations=accept-responsibility
          gpu_device=0
          amd_performance_level=high
          [filter]
          whitelist=steam;lutris;wine;playonlinux
          GMEOF

            echo ">>> AMD configuré (AMDGPU + RADV Vulkan)"

          # ════════════════════════════════════════
          #  INTEL — drivers i915 optimisés
          # ════════════════════════════════════════
          else
            echo ">>> Intel détecté (ou GPU inconnu) — i915 optimisé..."

            apt-get update -qq
            apt-get install -y \
              firmware-misc-nonfree \
              intel-media-va-driver \
              libva-drm2 \
              libva-x11-2 \
              vainfo \
              libgl1-mesa-dri \
              mesa-vulkan-drivers \
              libvulkan1 \
              vulkan-tools 2>/dev/null || true

            # i915 tuning (Intel HD 620 / UHD / Iris / Arc)
            cat > /etc/modprobe.d/i915-gaming.conf << 'I9EOF'
          # MineOS Intel Gaming
          # GuC = GPU microcontroller (meilleure gestion tasks)
          # HuC = HEVC/AVC offload
          # FBC = Frame Buffer Compression (économie VRAM)
          # PSR = Panel Self Refresh
          options i915 enable_guc=3
          options i915 enable_fbc=1
          options i915 enable_psr=1
          options i915 fastboot=1
          options i915 nuclear_pageflip=1
          options i915 enable_dp_mst=1
          I9EOF

            # Variables env Intel gaming
            cat >> /etc/environment << 'ENVEOF'
          MESA_LOADER_DRIVER_OVERRIDE=iris
          ANV_ENABLE_PIPELINE_CACHE=1
          mesa_glthread=true
          vblank_mode=0
          ENVEOF

            echo ">>> Intel configuré (i915 GuC/HuC + Iris Vulkan)"
          fi

          # ════════════════════════════════════════
          #  VULKAN — ICD universel
          # ════════════════════════════════════════
          echo ">>> Configuration Vulkan universelle..."
          mkdir -p /etc/vulkan/icd.d

          # Script de sélection ICD au boot selon GPU présent
          cat > /usr/local/bin/mineos-vulkan-setup << 'VKEOF'
          #!/bin/bash
          # MineOS Vulkan ICD auto-selector
          GPU=$(lspci | grep -iE "VGA|3D" | head -1)
          if echo "$GPU" | grep -qi nvidia; then
            export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/nvidia_icd.json
          elif echo "$GPU" | grep -qiE "amd|radeon"; then
            export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/radeon_icd.x86_64.json
          else
            export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/intel_icd.x86_64.json
          fi
          export VK_LAYER_PATH=/usr/share/vulkan/explicit_layer.d
          echo "Vulkan ICD: $VK_ICD_FILENAMES"
          VKEOF
          chmod +x /usr/local/bin/mineos-vulkan-setup

          # Ajouter au bashrc
          echo 'source /usr/local/bin/mineos-vulkan-setup 2>/dev/null' >> /etc/skel/.bashrc

          # ════════════════════════════════════════
          #  TWEAKS SYSTÈME COMMUNS
          # ════════════════════════════════════════
          cat > /etc/sysctl.d/99-mineos-gaming.conf << 'SEOF'
          # MineOS Gaming — sysctl tweaks
          vm.swappiness=10
          vm.dirty_ratio=15
          vm.dirty_background_ratio=5
          kernel.sched_autogroup_enabled=1
          kernel.perf_event_paranoid=1
          net.core.netdev_max_backlog=16384
          fs.file-max=2097152
          SEOF

          cat >> /etc/security/limits.conf << 'LEOF'
          * soft nofile 1048576
          * hard nofile 1048576
          * soft memlock unlimited
          * hard memlock unlimited
          LEOF

          mkdir -p /etc/pulse
          cat > /etc/pulse/daemon.conf << 'PAEOF'
          default-sample-rate = 48000
          alternate-sample-rate = 44100
          default-fragment-size-msec = 5
          default-fragments = 2
          realtime-scheduling = yes
          realtime-priority = 9
          high-priority = yes
          nice-level = -15
          PAEOF

          # Script info GPU (dans terminal)
          cat > /usr/local/bin/mineos-gpu-info << 'GIEOF'
          #!/bin/bash
          echo "=== MineOS GPU Info ==="
          lspci | grep -iE "VGA|3D|Display"
          echo ""
          echo "--- OpenGL ---"
          glxinfo 2>/dev/null | grep -E "renderer|version" | head -5 || echo "glxinfo non dispo"
          echo ""
          echo "--- Vulkan ---"
          vulkaninfo 2>/dev/null | grep -E "deviceName|driverVersion" | head -5 || echo "vulkaninfo non dispo"
          echo ""
          echo "--- VRAM / Mémoire GPU ---"
          if command -v nvidia-smi &>/dev/null; then
            nvidia-smi --query-gpu=name,memory.total,memory.used,temperature.gpu --format=csv,noheader
          elif command -v radeontop &>/dev/null; then
            echo "AMD: utilise radeontop pour le monitoring"
          else
            cat /sys/class/drm/card0/device/mem_info_vram_total 2>/dev/null | \
              awk '{printf "VRAM total: %.0f MB\n", $1/1048576}' || echo "Info VRAM non dispo"
          fi
          GIEOF
          chmod +x /usr/local/bin/mineos-gpu-info

          echo ">>> Tweaks gaming + GPU configurés"
          HOOKEOF

          I9EOF

          cat >> /etc/security/limits.conf << 'LEOF'
          * soft nofile 1048576
          * hard nofile 1048576
          LEOF

          mkdir -p /etc/pulse
          cat > /etc/pulse/daemon.conf << 'PAEOF'
          default-sample-rate = 48000
          default-fragment-size-msec = 5
          default-fragments = 2
          realtime-scheduling = yes
          realtime-priority = 9
          high-priority = yes
          nice-level = -15
          PAEOF
          HOOKEOF

          # ── Bureau Openbox
          sudo tee config/hooks/live/0600-desktop.hook.chroot << 'HOOKEOF'
          #!/bin/bash
          set -e
          echo ">>> Bureau MineOS..."
          mkdir -p /etc/skel/.config/{openbox,tint2,picom,nitrogen}
          mkdir -p /etc/skel/{Bureau,Documents,Images,Musique,Téléchargements,Jeux}
          mkdir -p /usr/share/themes/MineOS-Dark/{gtk-3.0,gtk-2.0}

          cat > /usr/share/themes/MineOS-Dark/gtk-3.0/gtk.css << 'CSS'
          @define-color bg_color #1a1a2e;
          @define-color fg_color #e2e8f0;
          @define-color base_color #16213e;
          @define-color selected_bg_color #4ade80;
          @define-color selected_fg_color #0d1117;
          window,.background{background-color:@bg_color;color:@fg_color}
          headerbar,.titlebar{background:#0d2137;border-bottom:1px solid #2d4a6e}
          button{background:rgba(74,222,128,.1);border:1px solid #2d4a6e;border-radius:4px;color:@fg_color}
          button:hover{background:rgba(74,222,128,.2);border-color:#4ade80}
          entry{background:rgba(0,0,0,.4);border:1px solid #2d4a6e;border-radius:4px;color:#22d3ee}
          treeview,.view{background:@base_color;color:@fg_color}
          treeview:selected{background:rgba(74,222,128,.15);color:#4ade80}
          CSS

          cat > /etc/skel/.config/openbox/autostart << 'AUTO'
          nitrogen --restore &
          picom --config ~/.config/picom/picom.conf &
          tint2 &
          nm-applet &
          dunst &
          pulseaudio --start &
          xdg-user-dirs-update &
          /usr/lib/gamemode/gamemoded 2>/dev/null &
          AUTO

          cat > /etc/skel/.config/openbox/menu.xml << 'MENUEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <openbox_menu>
            <menu id="root-menu" label="⛏ MineOS">
              <item label="🌐 Chrome"><action name="Execute"><command>google-chrome-stable</command></action></item>
              <menu id="gaming-menu" label="🎮 Gaming">
                <item label="Steam"><action name="Execute"><command>gamemoderun steam</command></action></item>
                <item label="Lutris"><action name="Execute"><command>lutris</command></action></item>
                <item label="PlayOnLinux"><action name="Execute"><command>playonlinux</command></action></item>
                <separator/>
                <item label="⚡ Lancer .exe"><action name="Execute"><command>mineos-exe</command></action></item>
                <item label="Winetricks"><action name="Execute"><command>winetricks --gui</command></action></item>
              </menu>
              <item label="📁 Fichiers"><action name="Execute"><command>thunar</command></action></item>
              <item label="💻 Terminal"><action name="Execute"><command>tilix</command></action></item>
              <item label="📝 Bloc-notes"><action name="Execute"><command>mousepad</command></action></item>
              <item label="🎵 VLC"><action name="Execute"><command>vlc</command></action></item>
              <separator/>
              <item label="⚙️ Apparence"><action name="Execute"><command>lxappearance</command></action></item>
              <separator/>
              <item label="⏻ Éteindre"><action name="Execute"><command>systemctl poweroff</command></action></item>
              <item label="🔄 Redémarrer"><action name="Execute"><command>systemctl reboot</command></action></item>
            </menu>
          </openbox_menu>
          MENUEOF

          cat > /etc/skel/.config/openbox/rc.xml << 'RCEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <openbox_config>
            <theme><name>MineOS-Dark</name>
              <font place="ActiveWindow"><name>Noto Sans</name><size>10</size><weight>Bold</weight></font>
            </theme>
            <desktops><number>4</number><firstdesk>1</firstdesk></desktops>
            <keyboard>
              <keybind key="Super-Return"><action name="Execute"><command>tilix</command></action></keybind>
              <keybind key="Super-e"><action name="Execute"><command>thunar</command></action></keybind>
              <keybind key="Super-b"><action name="Execute"><command>google-chrome-stable</command></action></keybind>
              <keybind key="Super-g"><action name="Execute"><command>gamemoderun steam</command></action></keybind>
              <keybind key="Super-l"><action name="Execute"><command>lutris</command></action></keybind>
              <keybind key="Super-r"><action name="Execute"><command>rofi -show run</command></action></keybind>
              <keybind key="A-F4"><action name="Close"/></keybind>
              <keybind key="Super-d"><action name="ToggleShowDesktop"/></keybind>
              <keybind key="A-Tab"><action name="NextWindow"/></keybind>
            </keyboard>
            <mouse>
              <context name="Desktop">
                <mousebind button="Right" action="Press">
                  <action name="ShowMenu"><menu>root-menu</menu></action>
                </mousebind>
              </context>
              <context name="Titlebar">
                <mousebind button="Left" action="Drag"><action name="Move"/></mousebind>
                <mousebind button="Left" action="DoubleClick"><action name="MaximizeWindow"/></mousebind>
              </context>
            </mouse>
          </openbox_config>
          RCEOF

          cat > /etc/skel/.bashrc << 'BASHEOF'
          export LANG=fr_FR.UTF-8
          export WINEFSYNC=1
          export mesa_glthread=true
          PS1='\[\e[0;32m\]⛏ \[\e[1;36m\]\u\[\e[0;37m\]@\[\e[1;34m\]mineos\[\e[0;37m\]:\[\e[1;33m\]\w\[\e[0m\]\$ '
          alias ls='ls --color=auto'
          alias ll='ls -lah --color=auto'
          alias chrome='google-chrome-stable'
          alias exe='gamemoderun wine'
          alias exe-dxvk='DXVK_HUD=fps gamemoderun wine'
          alias steam='gamemoderun steam'
          [ -f /etc/bash_completion ] && . /etc/bash_completion
          echo "  ⛏  MineOS Gaming Edition — exe <fichier.exe> | Super+G = Steam"
          BASHEOF

          # Wallpaper
          mkdir -p /usr/share/mineos
          python3 -c "
          from PIL import Image,ImageDraw
          img=Image.new('RGB',(1920,1080),'#1a1a2e')
          d=ImageDraw.Draw(img)
          [d.line([(x,0),(x,1080)],fill='#1f2a3d') for x in range(0,1920,32)]
          [d.line([(0,y),(1920,y)],fill='#1f2a3d') for y in range(0,1080,32)]
          img.save('/usr/share/mineos/wallpaper.png')
          " 2>/dev/null || convert -size 1920x1080 gradient:'#1a1a2e-#0d2137' /usr/share/mineos/wallpaper.png 2>/dev/null || true

          mkdir -p /etc/skel/.config/nitrogen
          cat > /etc/skel/.config/nitrogen/bg-saved.cfg << 'NITEOF'
          [xin_-1]
          file=/usr/share/mineos/wallpaper.png
          mode=4
          bgcolor=#1a1a2e
          NITEOF
          HOOKEOF

          # ── LightDM autologin
          sudo tee config/hooks/live/0700-lightdm.hook.chroot << 'HOOKEOF'
          #!/bin/bash
          set -e
          mkdir -p /etc/lightdm
          cat > /etc/lightdm/lightdm.conf << 'LDEOF'
          [Seat:*]
          autologin-user=user
          autologin-user-timeout=0
          greeter-session=lightdm-gtk-greeter
          user-session=openbox
          LDEOF
          cat > /etc/lightdm/lightdm-gtk-greeter.conf << 'GEOF'
          [greeter]
          background=#1a1a2e
          theme-name=MineOS-Dark
          icon-theme-name=Papirus-Dark
          font-name=Noto Sans 11
          clock-format=%H:%M — %A %d %B
          GEOF
          HOOKEOF

          # ── Script EXE launcher
          sudo mkdir -p config/includes.chroot/usr/local/bin
          sudo tee config/includes.chroot/usr/local/bin/mineos-exe << 'EXEOF'
          #!/bin/bash
          FILE="$1"
          if [ -z "$FILE" ]; then
            FILE=$(zenity --file-selection \
              --file-filter="Exécutables | *.exe *.msi *.bat" \
              --title="MineOS — Choisir un .exe" 2>/dev/null)
            [ -z "$FILE" ] && exit 0
          fi
          notify-send "⚡ MineOS" "Lancement : $(basename "$FILE")" 2>/dev/null
          WINEFSYNC=1 gamemoderun wine "$FILE"
          EXEOF
          sudo chmod +x config/includes.chroot/usr/local/bin/mineos-exe

          sudo chmod +x config/hooks/live/*.hook.chroot
          echo "Hooks configurés"

      # ── 10. Compression xz ───────────────────────────────
      - name: Setup compression
        working-directory: lb-workspace
        run: |
          sudo mkdir -p config/compression
          echo "xz" | sudo tee config/compression/filesystem

      # ── 11. BUILD ────────────────────────────────────────
      - name: Run lb build
        working-directory: lb-workspace
        run: |
          echo ">>> Démarrage lb build..."
          sudo lb build 2>&1 | tee /tmp/lb-build.log
          echo ">>> lb build terminé"

      # ── 12. Récupérer l'ISO ──────────────────────────────
      - name: Collect ISO
        run: |
          VERSION="${{ steps.ver.outputs.V }}"
          ISO=$(find lb-workspace -name "*.iso" 2>/dev/null | head -1)
          if [ -z "$ISO" ]; then
            echo "❌ ISO introuvable. Dernières lignes du log :"
            tail -100 /tmp/lb-build.log
            exit 1
          fi
          mkdir -p build
          cp "$ISO" "build/MineOS-Gaming-${VERSION}-x86_64.iso"
          sha256sum "build/MineOS-Gaming-${VERSION}-x86_64.iso" > "build/SHA256SUMS"
          echo "✅ ISO : $(du -sh build/MineOS-Gaming-${VERSION}-x86_64.iso | cut -f1)"

      # ── 13. Stats ────────────────────────────────────────
      - name: Get stats
        id: stats
        run: |
          ISO=$(ls build/*.iso 2>/dev/null | head -1)
          echo "SIZE=$(du -sh $ISO | cut -f1)" >> $GITHUB_OUTPUT
          echo "SHA256=$(sha256sum $ISO | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      # ── 14. Upload artifact ──────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MineOS-Gaming-${{ steps.ver.outputs.V }}
          path: build/
          retention-days: 30

      # ── 15. Release sur tag ──────────────────────────────
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          name: "MineOS Gaming ${{ steps.ver.outputs.V }}"
          body: |
            ## ⛏ MineOS Gaming Edition ${{ steps.ver.outputs.V }}
            - Steam + Proton | Lutris | Wine + DXVK | GameMode | MangoHud
            - Kernel Liquorix | Intel HD 620 optimisé | swappiness=10
            - **Taille :** ${{ steps.stats.outputs.SIZE }}
            - **SHA256 :** `${{ steps.stats.outputs.SHA256 }}`
            ```bash
            sudo dd if=MineOS-Gaming-${{ steps.ver.outputs.V }}-x86_64.iso of=/dev/sdX bs=4M status=progress
            ```
          files: build/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 16. Résumé ───────────────────────────────────────
      - name: Summary
        run: |
          echo "## ✅ MineOS Gaming Build" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.ver.outputs.V }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Taille | ${{ steps.stats.outputs.SIZE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA256 | \`${{ steps.stats.outputs.SHA256 }}\` |" >> $GITHUB_STEP_SUMMARY
