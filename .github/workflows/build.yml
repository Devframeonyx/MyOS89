name: Build MineOS Gaming ISO

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (ex: 1.0.0)'
        required: false
        default: '1.0.0'
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        id: ver
        run: |
          V="${{ github.event.inputs.version || github.ref_name || '1.0.0' }}"
          V="${V#v}"
          echo "V=$V" >> $GITHUB_OUTPUT
          echo "Building MineOS Gaming v$V"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            live-build debootstrap squashfs-tools xorriso \
            grub-pc-bin grub-efi-amd64-bin mtools isolinux \
            syslinux-common rsync wget curl ca-certificates \
            imagemagick python3-pil
          echo "live-build: $(lb --version)"

      - name: Build ISO
        run: sudo bash scripts/build-all.sh "${{ steps.ver.outputs.V }}"

      - name: Copy ISO to workspace
        run: |
          mkdir -p build
          sudo cp /opt/mineos-output/*.iso build/ 2>/dev/null || true
          sudo cp /opt/mineos-output/SHA256SUMS build/ 2>/dev/null || true
          sudo chown -R $USER:$USER build/
          ls -lh build/

      - name: Get stats
        id: stats
        run: |
          ISO=$(ls build/*.iso 2>/dev/null | head -1)
          if [ -n "$ISO" ]; then
            echo "SIZE=$(du -sh $ISO | cut -f1)" >> $GITHUB_OUTPUT
            echo "SHA256=$(sha256sum $ISO | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          else
            echo "ISO manquant"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MineOS-Gaming-${{ steps.ver.outputs.V }}
          path: build/
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          name: "MineOS Gaming ${{ steps.ver.outputs.V }}"
          body: |
            ## MineOS Gaming ${{ steps.ver.outputs.V }}
            - Steam | Lutris | Wine + DXVK | GameMode | MangoHud
            - GPU : NVIDIA / AMD / Intel auto-detecte
            - Kernel Liquorix | swappiness=10 | audio low-latency
            - **Taille :** ${{ steps.stats.outputs.SIZE }}
            - **SHA256 :** `${{ steps.stats.outputs.SHA256 }}`
            ```bash
            sudo dd if=MineOS-Gaming-${{ steps.ver.outputs.V }}-x86_64.iso of=/dev/sdX bs=4M status=progress
            ```
          files: build/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## MineOS Gaming Build OK" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.ver.outputs.V }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Taille | ${{ steps.stats.outputs.SIZE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA256 | \`${{ steps.stats.outputs.SHA256 }}\` |" >> $GITHUB_STEP_SUMMARY
